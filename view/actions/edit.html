<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
	<title>Edit Pertanyaan | Quiz Admin</title>
	<style>
		/* Design tokens — Quiet Luxury SaaS archetype */
		:root {
			--bg-canvas: #f7f5f0;
			--bg-surface: #ffffff;
			--border-subtle: #e7e5df;
			--border-hover: #d1ccc4;
			--accent-primary: #2563eb;
			--accent-hover: #1d4ed8;
			--accent-foreground: #ffffff;
			--text-primary: #1a1917;
			--text-secondary: #6e6b65;
			--text-muted: #9a968e;
			--radius-sm: 8px;
			--radius-md: 12px;
		}

		* { box-sizing: border-box; }
		html, body { margin: 0; }
		body {
			font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", sans-serif;
			color: var(--text-primary);
			background: var(--bg-canvas);
			line-height: 1.5;
		}

		.navbar {
			background: var(--bg-surface);
			color: var(--text-primary);
			border-bottom: 1px solid var(--border-subtle);
			padding: 0.75rem 1rem;
		}
		.navbar a { color: var(--text-primary); text-decoration: none; font-weight: 500; }
		.navbar a:hover { color: var(--accent-primary); }

		.container {
			max-width: 720px;
			margin: 0 auto;
			padding: 0 1.5rem;
			padding-top: 12px;
			
		}

		h2 {
			font-size: clamp(1.5rem, 1.25rem + 1vw, 2rem);
			font-weight: 700;
			letter-spacing: -0.02em;
			margin: 0 0 1rem;
		}

		label {
			display: block;
			font-size: 0.875rem;
			font-weight: 600;
			margin-bottom: 0.375rem;
			color: var(--text-secondary);
		}

		hr {
			border: none;
			border-top: 1px solid var(--border-subtle);
			margin: 1.5rem 0;
		}

		.card {
			background: var(--bg-surface);
			border: 1px solid var(--border-subtle);
			border-radius: var(--radius-md);
			padding: 0;
			overflow: hidden;
		}
		.card-body { padding: 2rem; }
		@media (max-width: 640px) {
			.card-body { padding: 1.25rem; }
			.container { padding: 0 1rem; }
		}

		.form-control {
			width: 100%;
			padding: 0.625rem 0.875rem;
			font-size: 1rem;
			border: 1px solid var(--border-subtle);
			border-radius: var(--radius-sm);
			background: var(--bg-surface);
			transition: border-color 140ms ease-out, box-shadow 140ms ease-out;
		}
		.form-control:focus {
			border-color: var(--accent-primary);
			outline: none;
			box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
		}
		select.form-control { appearance: none; }

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
			padding: 0.625rem 1.25rem;
			font-size: 0.9375rem;
			font-weight: 600;
			border: 1px solid transparent;
			border-radius: var(--radius-sm);
			cursor: pointer;
			transition: background-color 140ms ease-out, transform 80ms ease-out, filter 140ms ease-out;
			user-select: none;
			min-height: 44px;
			text-decoration: none;
		}
		.btn-primary {
			background: var(--accent-primary);
			color: var(--accent-foreground);
		}
		.btn-primary:hover { filter: brightness(1.08); }
		.btn-primary:focus-visible {
			outline: 2px solid var(--accent-primary);
			outline-offset: 2px;
		}
		.btn-primary:active { transform: scale(0.97); }
		.btn-secondary {
			background: var(--bg-surface);
			color: var(--text-primary);
			border-color: var(--border-subtle);
		}
		.btn-secondary:hover { background: #f4f2ea; border-color: var(--border-hover); }
		.btn-secondary:focus-visible {
			outline: 2px solid var(--accent-primary);
			outline-offset: 2px;
		}
		.btn-secondary:active { transform: scale(0.97); }

		.form-actions {
			display: flex;
			gap: 0.75rem;
			flex-wrap: wrap;
			margin-top: 1.5rem;
		}

		.text-muted { color: var(--text-muted); }
		.btn-sm {
			padding: 0.375rem 0.75rem;
			font-size: 0.8125rem;
			min-height: 32px;
		}
	</style>
</head>
<body>

	<!--start nav-->
	<nav class="navbar">
		<div class="container-fluid d-flex justify-content-between align-items-center">
			<a class="navbar-brand fw-bold" href="/">Edit Item</a>
		</div>
	</nav>
	<!--end nav-->

	<div class="container">
		<main>
			<div class="card">
				<div class="card-body">
					<div class="mb-4">
						<a href="/" class="btn btn-secondary btn-sm mb-3">← Kembali ke Beranda</a>
					</div>
					<h2>Edit Pertanyaan</h2>
					<hr>
					<form action="/actions/edit?Id={{.Id}}" method="POST">
						<div class="mb-3">
							<label for="question">Pertanyaan</label>
							<input class="form-control" id="question" name="question" type="text" value="{{.Question}}" placeholder="Masukkan pertanyaan" autocomplete="off">
						</div>
						<div class="mb-3">
							<label for="option_a">Opsi Jawaban A</label>
							<input class="form-control" id="option_a" name="option_a" type="text" value="{{.Option_a}}" placeholder="Opsi Jawaban A" autocomplete="off">
						</div>
						<div class="mb-3">
							<label for="option_b">Opsi Jawaban B</label>
							<input class="form-control" id="option_b" name="option_b" type="text" value="{{.Option_b}}" placeholder="Opsi Jawaban B" autocomplete="off">
						</div>
						<div class="mb-3">
							<label for="option_c">Opsi Jawaban C</label>
							<input class="form-control" id="option_c" name="option_c" type="text" value="{{.Option_c}}" placeholder="Opsi Jawaban C" autocomplete="off">
						</div>
						<div class="mb-3">
							<label for="option_d">Opsi Jawaban D</label>
							<input class="form-control" id="option_d" name="option_d" type="text" value="{{.Option_d}}" placeholder="Opsi Jawaban D" autocomplete="off">
						</div>
						<div class="mb-3">
							<label for="correct_answer">Jawaban yang Benar</label>
							<select class="form-control" id="correct_answer" name="correct_answer">
								<option value="">Pilih salah satu…</option>
								<option value="a" {{if eq .Correct_answer "a"}}selected{{end}}>A</option>
								<option value="b" {{if eq .Correct_answer "b"}}selected{{end}}>B</option>
								<option value="c" {{if eq .Correct_answer "c"}}selected{{end}}>C</option>
								<option value="d" {{if eq .Correct_answer "d"}}selected{{end}}>D</option>
							</select>
						</div>
						<div class="mb-3">
							<label for="difficulty">Tingkat Kesulitan</label>
							<select class="form-control" id="difficulty" name="difficulty">
								<option value="">Pilih salah satu…</option>
								<option value="easy" {{if eq .Difficulty "easy"}}selected{{end}}>Easy</option>
								<option value="medium" {{if eq .Difficulty "medium"}}selected{{end}}>Medium</option>
								<option value="hard" {{if eq .Difficulty "hard"}}selected{{end}}>Hard</option>
							</select>
						</div>
						<div class="form-actions">
							<a href="/actions" class="btn btn-secondary">Batal</a>
							<button type="submit" class="btn btn-primary">Update</button>
						</div>
					</form>
				</div>
			</div>
		</main>
	</div>
</body>
</html>
