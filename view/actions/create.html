<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
	<title>Document</title>
</head>
<body>

    <!--start nav-->
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
          </div>
          <div class="drawer-body">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/actions">Features</a>
              </li>
            </ul>
          </div>
        </dialog>
      </div>
    </nav>
    <!--end nav-->


    <div class="container mt-5">

        <div class="row d-flex justify-content-center">
            <div class="col-6">
                <h2>Buat Pertanyaan</h2>
                <hr>
                <form action="/actions/create" method="POST">
                  <div class="mb-3">
                      <label class="form-label">Question input</label>
                      <input class="form-control" name="question" type="text" placeholder="Question input" aria-label="Question input" autocomplete="off">
                  </div>
                  <div class="mb-3">
                      <label class="form-label">Opsi Jawaban A</label>
                      <input class="form-control" name="option_a" type="text" placeholder="Opsi Jawaban A" aria-label="Opsi Jawaban A" autocomplete="off">
                  </div>
                  <div class="mb-3">
                      <label class="form-label">Opsi Jawaban B</label>
                      <input class="form-control" name="option_b" type="text" placeholder="Opsi Jawaban B" aria-label="Opsi Jawaban B" autocomplete="off">
                  </div>
                  <div class="mb-3">
                      <label class="form-label">Opsi Jawaban C</label>
                      <input class="form-control" name="option_c" type="text" placeholder="Opsi Jawaban C" aria-label="Opsi Jawaban C" autocomplete="off">
                  </div>
                  <div class="mb-3">
                      <label class="form-label">Opsi Jawaban D</label>
                      <input class="form-control" name="option_d" type="text" placeholder="Opsi Jawaban D" aria-label="Opsi Jawaban D" autocomplete="off">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Jawaban yang Benar</label>
                    <select name="correct_answer" class="form-control">
                      <option>Choose one…</option>
                      <option value="a">A</option>
                      <option value="b">B</option>
                      <option value="c">C</option>
                      <option value="d">D</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Tingkat Kesulitan</label>
                    <select name="difficulty" class="form-control">
                        <option>Choose one…</option>
                      <option value="easy">Easy</option>
                      <option value="medium">Medium</option>
                      <option value="hard">Hard</option>
                    </select>
                  </div>
                  <div class="float-end mb-5">
                      <a href="/actions" class="btn btn-secondary">cancel</a>
                      <button type="submit" class="btn btn-primary">Save</button>
                  </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
