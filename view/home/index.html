<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
	<title>Beranda | Quiz Admin</title>
	<style>
		:root {
			--bg-canvas: #f7f5f0;
			--bg-surface: #ffffff;
			--border-subtle: #e7e5df;
			--border-hover: #d1ccc4;
			--accent-primary: #2563eb;
			--accent-hover: #1d4ed8;
			--accent-foreground: #ffffff;
			--text-primary: #1a1917;
			--text-secondary: #6e6b65;
			--text-muted: #9a968e;
			--radius-sm: 8px;
			--radius-md: 12px;
		}

		* { box-sizing: border-box; }
		html, body { margin: 0; }
		body {
			font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", sans-serif;
			color: var(--text-primary);
			background: var(--bg-canvas);
			line-height: 1.5;
		}

		.navbar {
			background: var(--bg-surface);
			color: var(--text-primary);
			border-bottom: 1px solid var(--border-subtle);
			padding: 0.75rem 1rem;
		}
		.navbar a { color: var(--text-primary); text-decoration: none; font-weight: 500; }
		.navbar a:hover { color: var(--accent-primary); }

		.container {
			max-width: 960px;
			margin: 0 auto;
			padding: 0 1.5rem;
			padding-top: 12px;
		}

		p {
			color: var(--text-secondary);
			font-size: 1.125rem;
			margin-bottom: 1.5rem;
		}

		.card {
			background: var(--bg-surface);
			border: 1px solid var(--border-subtle);
			border-radius: var(--radius-md);
			padding: 0;
			overflow: hidden;
		}
		.card-body { padding: 3rem 2rem; text-align: center; }
		.ascii-banner {
		    display: flex;
			font-family: monospace;
			font-size: 20px;
			line-height: 1;
			color: var(--text-secondary);
			background: transparent;
			padding: 0.5rem;
			overflow-x: auto;
			text-align: left;
			color: steelblue;
			margin-bottom: 1rem;
			white-space: pre;
			justify-content: center;
		}
		@media (max-width: 640px) {
			.card-body { padding: 2rem 1.25rem; }
			.container { padding: 0 1rem; }
			.ascii-banner { font-size: 4px; padding: 0.25rem; }
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
			padding: 0.75rem 1.5rem;
			font-size: 1rem;
			font-weight: 600;
			border: 1px solid transparent;
			border-radius: var(--radius-sm);
			cursor: pointer;
			transition: background-color 140ms ease-out, transform 80ms ease-out, filter 140ms ease-out;
			user-select: none;
			min-height: 44px;
			text-decoration: none;
		}
		.btn-primary {
			background: var(--accent-primary);
			color: var(--accent-foreground);
		}
		.btn-primary:hover { filter: brightness(1.08); }
		.btn-primary:active { transform: scale(0.97); }
	</style>
</head>
<body>

	<!--start nav-->
	<nav class="navbar">
		<div class="container-fluid d-flex justify-content-between align-items-center">
			<a class="navbar-brand fw-bold" href="/">Beranda</a>
		</div>
	</nav>
	<!--end nav-->

	<div class="container py-5">
		<main>
			<div class="card">
				<div class="card-body">
					<pre class="ascii-banner">{{.AsciiArt}}</pre>
					<p>Kelola pertanyaan kuis, opsi jawaban, dan tingkat kesulitan dengan mudah.</p>
					<a href="/actions" class="btn btn-primary">Kelola Pertanyaan</a>
				</div>
			</div>
		</main>
	</div>
</body>
</html>
